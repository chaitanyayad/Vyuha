<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700"
     font-family="ui-sans-serif, system-ui, 'Segoe UI', Inter, Roboto, sans-serif"
     role="img" aria-label="VYUHA architecture: an agent submits a tool intent to a gateway of five rings, which returns allow, block or escalate to the tool executor.">
  <title>VYUHA architecture</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8ba3"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e4574f"/>
    </marker>
    <style>
      .lbl   { fill:#8d97ab; font-size:12px; }
      .mono  { font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; }
      .h     { fill:#e6eaf2; font-size:15px; font-weight:600; }
      .ring  { fill:#e6eaf2; font-size:14px; font-weight:600; }
      .desc  { fill:#8d97ab; font-size:12.5px; }
      .num   { fill:#0b0e13; font-size:12px; font-weight:700; }
      .tiny  { fill:#5c6579; font-size:11px; }
    </style>
  </defs>

  <!-- page background: explicit, so the diagram reads the same in light and dark themes -->
  <rect width="980" height="700" rx="10" fill="#0b0e13"/>

  <!-- ── user goal ─────────────────────────────────────────── -->
  <text x="490" y="34" class="lbl" text-anchor="middle">user goal</text>
  <line x1="490" y1="44" x2="490" y2="62" stroke="#7f8ba3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── agent ─────────────────────────────────────────────── -->
  <rect x="300" y="66" width="380" height="52" rx="9" fill="#12161f" stroke="#222938"/>
  <text x="490" y="90" class="h" text-anchor="middle">Agent (planner)</text>
  <text x="490" y="107" class="desc" text-anchor="middle">cannot call a tool directly</text>

  <line x1="490" y1="118" x2="490" y2="152" stroke="#7f8ba3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="504" y="140" class="lbl mono">ToolIntent</text>

  <!-- ── gateway ───────────────────────────────────────────── -->
  <rect x="70" y="156" width="840" height="330" rx="12" fill="#0f131b" stroke="#2b3446" stroke-width="1.5"/>
  <text x="94" y="182" class="h" letter-spacing="4">V Y U H A</text>
  <text x="200" y="182" class="tiny">policy-enforcing gateway</text>

  <!-- ring rows -->
  <g>
    <!-- Ring 1 -->
    <rect x="94" y="196" width="792" height="46" rx="8" fill="#151b26" stroke="#232c3d"/>
    <circle cx="120" cy="219" r="12" fill="#6ea8fe"/>
    <text x="120" y="223" class="num" text-anchor="middle">1</text>
    <text x="146" y="216" class="ring">Provenance / taint</text>
    <text x="146" y="233" class="desc">where did this come from? — separates data taint from control taint</text>
    <text x="870" y="225" class="tiny mono" text-anchor="end">deterministic</text>

    <!-- Ring 2 -->
    <rect x="94" y="250" width="792" height="46" rx="8" fill="#151b26" stroke="#232c3d"/>
    <circle cx="120" cy="273" r="12" fill="#6ea8fe"/>
    <text x="120" y="277" class="num" text-anchor="middle">2</text>
    <text x="146" y="270" class="ring">Kill-chain correlation</text>
    <text x="146" y="287" class="desc">what led to this? — causal graph of the whole session</text>
    <text x="870" y="279" class="tiny mono" text-anchor="end">deterministic</text>

    <!-- Ring 3 -->
    <rect x="94" y="304" width="792" height="46" rx="8" fill="#151b26" stroke="#232c3d"/>
    <circle cx="120" cy="327" r="12" fill="#6ea8fe"/>
    <text x="120" y="331" class="num" text-anchor="middle">3</text>
    <text x="146" y="324" class="ring">Capability policy</text>
    <text x="146" y="341" class="desc">is this even allowed? — scopes, rate limits, argument rules</text>
    <text x="870" y="333" class="tiny mono" text-anchor="end">deterministic</text>

    <!-- Ring 4 -->
    <rect x="94" y="358" width="792" height="46" rx="8" fill="#141821" stroke="#2c2a24" stroke-dasharray="4 3"/>
    <circle cx="120" cy="381" r="12" fill="#e0a24a"/>
    <text x="120" y="385" class="num" text-anchor="middle">4</text>
    <text x="146" y="378" class="ring">Semantic judge</text>
    <text x="146" y="395" class="desc">does this text smell? — may escalate, never blocks alone</text>
    <text x="870" y="387" class="tiny mono" text-anchor="end" fill="#e0a24a">not load-bearing</text>

    <!-- Ring 5 -->
    <rect x="94" y="412" width="792" height="46" rx="8" fill="#151b26" stroke="#232c3d"/>
    <circle cx="120" cy="435" r="12" fill="#3fb98c"/>
    <text x="120" y="439" class="num" text-anchor="middle">5</text>
    <text x="146" y="432" class="ring">Trust ledger</text>
    <text x="146" y="449" class="desc">record + score + explain — append-only, hash-chained</text>
    <text x="870" y="441" class="tiny mono" text-anchor="end">sha256 chain</text>
  </g>

  <!-- ── verdict ───────────────────────────────────────────── -->
  <line x1="490" y1="486" x2="490" y2="500" stroke="#7f8ba3" stroke-width="1.5"/>
  <line x1="342" y1="500" x2="628" y2="500" stroke="#7f8ba3" stroke-width="1.5"/>
  <line x1="342" y1="500" x2="342" y2="516" stroke="#7f8ba3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="500" x2="485" y2="516" stroke="#7f8ba3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="500" x2="628" y2="516" stroke="#7f8ba3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="286" y="516" width="112" height="30" rx="7" fill="#143129" stroke="#245244"/>
    <text x="342" y="536" class="mono" fill="#3fb98c" font-size="12.5" text-anchor="middle">ALLOW</text>

    <rect x="410" y="516" width="150" height="30" rx="7" fill="#2a2214" stroke="#4a3a1c"/>
    <text x="485" y="536" class="mono" fill="#e0a24a" font-size="12.5" text-anchor="middle">ESCALATE</text>

    <rect x="572" y="516" width="112" height="30" rx="7" fill="#3a1a1a" stroke="#5a2626"/>
    <text x="628" y="536" class="mono" fill="#ff9a94" font-size="12.5" text-anchor="middle">BLOCK</text>
  </g>

  <!-- allow path continues down; block/escalate stop here -->
  <line x1="342" y1="546" x2="342" y2="586" stroke="#7f8ba3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="546" x2="485" y2="576" stroke="#e0a24a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="497" y="572" class="tiny" fill="#e0a24a">held for a human</text>
  <line x1="628" y1="546" x2="628" y2="576" stroke="#e4574f" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="640" y="572" class="tiny" fill="#e4574f">never executed</text>

  <!-- ── executor ──────────────────────────────────────────── -->
  <rect x="140" y="590" width="700" height="72" rx="9" fill="#12161f" stroke="#222938"/>
  <text x="490" y="614" class="h" text-anchor="middle">Tool executor</text>
  <text x="490" y="634" class="mono desc" text-anchor="middle" font-size="12">read_email · search_docs · read_file · db_query · send_email · http_post</text>
  <text x="490" y="652" class="tiny" text-anchor="middle">outputs return labelled with their origin, feeding Ring 1 on the next call</text>

  <!-- feedback loop: tool output provenance re-enters the gateway -->
  <path d="M140,626 C96,626 60,626 60,560 L60,219 L94,219" fill="none"
        stroke="#3fb98c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.75"/>
  <text x="24" y="400" class="tiny" fill="#3fb98c" transform="rotate(-90 24 400)" text-anchor="middle">labelled output</text>
</svg>
